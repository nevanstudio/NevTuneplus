# Project-wide Gradle settings optimized for hardware specs:
# CPU: Intel Core i3-4150 (2 Cores / 4 Threads @ 3.50GHz) | RAM: 8 GB | OS: Windows
# Goal: Maximum build speed while keeping Windows OS, Android Studio, and mouse/UI smooth and lag-free.

# Lower Gradle CPU process priority on Windows so OS, mouse, browser, and IDE stay responsive
org.gradle.priority=low


# JVM Memory & JIT Compiler Tuning for 8 GB RAM / 4-Thread CPU:
# Optimized heap sizes to prevent OutOfMemory during heavy Kotlin 2.0+ K2 / Compose compilation.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:SoftRefLRUPolicyMSPerMB=1 -XX:CICompilerCount=2 -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Kotlin Compiler Daemon Memory & Thread limits so it does not freeze PC
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:CICompilerCount=2

# Keep daemon running for fast incremental builds
org.gradle.daemon=true

# Enable build cache to reuse task outputs and avoid re-compilation
org.gradle.caching=true

# Enable Configuration Cache to avoid configuration phase overhead on every build
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Enable parallel module compilation for faster multi-module builds
org.gradle.parallel=true

# Limit worker threads to 2, leaving 2 logical CPU threads free for Windows OS & Android Studio UI
org.gradle.workers.max=2

# Enable file system watching to avoid scanning the entire filesystem on each build
org.gradle.vfs.watch=true

# Kotlin incremental compilation optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
compose.desktop.packaging.checkJdkVendor=false

# Skip automatic watch app bundling during local phone debug builds for 2x faster builds
nevtuneplus.bundleWear=false

# Force IPv4 for repo downloads to prevent timeout delays
systemProp.java.net.preferIPv4Stack=true

# AndroidX and modular R class optimizations
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.precompile.dependencies.resources=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
