# Project-wide Gradle settings optimized for PC specs:
# CPU: 2 Cores / 4 Threads | RAM: 8 GB | OS: Windows
# Speeds up builds while keeping the PC smooth and responsive.

# Android Studio JDK / Java Home
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Gradle Daemon JVM memory: 2048m is optimal for an 8 GB RAM system,
# leaving ~6 GB for Windows OS and IDE, preventing disk swapping/freezing.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Keep daemon running for fast incremental builds
org.gradle.daemon=true

# Enable build cache to reuse task outputs and avoid recompilation
org.gradle.caching=true

# Enable parallel execution across decoupled modules
org.gradle.parallel=true

# 2 workers leaves threads available for OS responsiveness on a 4-thread CPU
org.gradle.workers.max=2

# Enable file system watching to avoid scanning the entire filesystem on each build
org.gradle.vfs.watch=true

# Kotlin incremental compilation and run in-process to avoid spawning an extra JVM daemon
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
compose.desktop.packaging.checkJdkVendor=false

# Force IPv4 for repo downloads to prevent timeout delays
systemProp.java.net.preferIPv4Stack=true

# AndroidX and modular R class optimizations
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
